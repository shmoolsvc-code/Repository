function preview(){if(!$('#preview'))return;const inc=readLines('in').reduce((a,m)=>a+m.amount,0),out=readLines('out').reduce((a,m)=>a+m.amount,0),price=Number($('#servicevalue').value)||0,adv=inc-price;$('#preview').innerHTML='<div class="metric"><span>'+tr('إجمالي الوارد','Total Receipts')+'</span><b class="good">'+sar(inc)+'</b></div><div class="metric"><span>'+tr('إجمالي الصادر','Total Payments')+'</span><b class="bad">'+sar(out)+'</b></div><div class="metric"><span>'+tr('رصيد العميل الجديد','New Customer Advance')+'</span><b>'+sar(Math.max(0,adv))+'</b></div><div class="metric"><span>'+tr('صافي حركة النقد (ليس الربح)','Net Cash Flow (Not Profit)')+'</span><b>'+sar(inc-out)+'</b></div>'}
async function getParty(){if($('#party')?.value)return $('#party').value;const name=$('#newparty')?.value.trim();if(!name)throw Error(tr('حدد العميل أو اكتب اسمه','Select or enter a customer'));const r=await db.from('open_finance_parties').insert({name,kind:'customer'}).select('id').single();if(r.error)throw r.error;return r.data.id}
async function saveOrder(){if(busy)return;busy=true;$('#saveOrder').disabled=true;try{const service_name=$('#servicename').value.trim(),service_amount=Number($('#servicevalue').value),date=$('#businessdate').value;if(!service_name||!Number.isFinite(service_amount)||service_amount<0||!date)throw Error(tr('أكمل اسم الخدمة والمبلغ والتاريخ','Complete service name, value and date'));const ins=readLines('in'),outs=readLines('out'),received=ins.reduce((a,x)=>a+x.amount,0);if(!ins.length&&!outs.length)throw Error(tr('أضف واردًا أو صادرًا','Add an incoming or outgoing movement'));const party_id=await getParty(),sr=await db.from('open_finance_services').insert({party_id,service_name,service_amount,business_date:date,created_by:null}).select('id').single();if(sr.error)throw sr.error;const entries=[];let remain=service_amount;for(const x of ins){const charge=Math.min(x.amount,remain);if(charge>0)entries.push({...x,party_id,service_id:sr.data.id,kind:'service_receipt',amount:charge,business_date:date,created_by:null});if(x.amount>charge)entries.push({...x,party_id,service_id:sr.data.id,kind:'customer_advance',amount:x.amount-charge,business_date:date,created_by:null});remain-=charge}for(const x of outs)entries.push({...x,party_id,service_id:sr.data.id,kind:'service_payment',business_date:date,created_by:null});const mr=await db.from('open_finance_movements').insert(entries);if(mr.error)throw mr.error;toast(tr('تم حفظ العملية سحابيًا','Operation saved to cloud'));tab='history';await load()}catch(e){err(e)}finally{busy=false;if($('#saveOrder'))$('#saveOrder').disabled=false}}
function movementHtml(){return '<h2>'+tr('حركة مالية مستقلة','Other Financial Movement')+'</h2><div class="card grid"><div class="field"><label>'+tr('نوع الحركة','Movement Type')+'</label><select id="kind"><option value="office_expense">'+tr('مصروف مكتب','Office Expense')+'</option><option value="customer_advance">'+tr('رصيد مقدم للعميل','Customer Advance')+'</option><option value="advance_refund">'+tr('رد مقدم للعميل','Refund Advance')+'</option><option value="custody_in">'+tr('استلام أمانة','Receive Custody')+'</option><option value="custody_out">'+tr('رد أمانة','Return Custody')+'</option><option value="transfer_out">'+tr('تحويل صادر بين الحسابات','Account Transfer (Outgoing)')+'</option></select></div><div class="field"><label>'+tr('الطرف','Party')+'</label><select id="moveParty">'+partyOptions()+'</select></div><div class="field"><label>'+tr('المبلغ','Amount')+'</label><input id="moveAmt" type="number" min=".01" step=".01"></div><div class="field"><label>'+tr('من حساب / إلى حساب','Account')+'</label><select id="moveAccount">'+accountOptions()+'</select></div><div class="field"><label>'+tr('الحساب المستلم للتحويل','Transfer Destination')+'</label><select id="destAccount">'+accountOptions()+'</select></div><div class="field"><label>'+tr('رقم الإيصال','Receipt Number')+'</label><input id="moveReceipt"></div><div class="field"><label>'+tr('التاريخ','Date')+'</label><input id="moveDate" type="date" value="'+dt()+'"></div><div class="field"><label>'+tr('بيان','Note')+'</label><input id="moveNote"></div><div><button class="primary" id="saveMovement">'+tr('حفظ الحركة','Save Movement')+'</button></div></div>'}
async function saveMovement(){try{const kind=$('#kind').value,amount=Number($('#moveAmt').value),party_id=$('#moveParty').value||null,account_id=$('#moveAccount').value,to=$('#destAccount').value,date=$('#moveDate').value;if(!(amount>0))throw Error(tr('المبلغ غير صحيح','Invalid amount'));if(['customer_advance','advance_refund','custody_in','custody_out'].includes(kind)&&!party_id)throw Error(tr('اختر الطرف','Select a party'));if(kind==='advance_refund'&&amount>custCredit(party_id))throw Error(tr('الرصيد غير كافٍ','Insufficient customer credit'));const base={amount,party_id,account_id,business_date:date,receipt_number:$('#moveReceipt').value.trim()||null,note:$('#moveNote').value.trim()||null,created_by:null};let entries=[{...base,kind}];if(kind==='transfer_out'){if(to===account_id)throw Error(tr('اختر حسابًا آخر','Choose another account'));const group=crypto.randomUUID();entries=[{...base,kind,transfer_group:group},{...base,kind:'transfer_in',account_id:to,transfer_group:group}]}const r=await db.from('open_finance_movements').insert(entries);if(r.error)throw r.error;toast(tr('تم حفظ الحركة','Movement saved'));await load()}catch(e){err(e)}}
function customersHtml(){return '<h2>'+tr('حسابات العملاء','Customer Accounts')+'</h2><div class="card scroll"><table><tr><th>'+tr('العميل','Customer')+'</th><th>'+tr('رصيد مقدم','Advance Credit')+'</th><th>'+tr('عدد الخدمات','Service Count')+'</th></tr>'+parties.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+sar(custCredit(p.id))+'</td><td>'+services.filter(s=>s.party_id===p.id).length+'</td></tr>').join('')+'</table></div>'}
function debtsHtml(){return '<h2>'+tr('ديون المكتب وديون العملاء','Office Debts & Receivables')+'</h2><div class="card grid"><div class="field"><label>'+tr('الطرف','Party')+'</label><select id="debtParty">'+partyOptions()+'</select></div><div class="field"><label>'+tr('النوع','Type')+'</label><select id="debtDirection"><option value="receivable">'+tr('لنا','Owed to Office')+'</option><option value="payable">'+tr('علينا','Owed by Office')+'</option></select></div><div class="field"><label>'+tr('القيمة','Amount')+'</label><input id="debtValue" type="number" min=".01" step=".01"></div><div class="field"><label>'+tr('تاريخ الاستحقاق','Due Date')+'</label><input id="debtDate" type="date"></div><button class="primary" id="saveDebt">'+tr('إضافة دين','Add Debt')+'</button></div><div class="card scroll"><table><tr><th>'+tr('الطرف','Party')+'</th><th>'+tr('النوع','Type')+'</th><th>'+tr('المتبقي','Remaining')+'</th><th>'+tr('الاستحقاق','Due')+'</th></tr>'+debts.map(d=>'<tr><td>'+esc(parties.find(x=>x.id===d.party_id)?.name)+'</td><td>'+tr(d.direction==='payable'?'علينا':'لنا',d.direction==='payable'?'Payable':'Receivable')+'</td><td>'+sar(d.remaining)+'</td><td>'+esc(d.due_on||'—')+'</td></tr>').join('')+'</table></div>'}
async function saveDebt(){try{const party_id=$('#debtParty').value,principal=Number($('#debtValue').value);if(!party_id||!(principal>0))throw Error(tr('تحقق من الطرف والقيمة','Check party and amount'));const r=await db.from('open_finance_debts').insert({party_id,direction:$('#debtDirection').value,principal,remaining:principal,due_on:$('#debtDate').value||null,created_by:null});if(r.error)throw r.error;toast(tr('تم حفظ الدين','Debt saved'));await load()}catch(e){err(e)}}
function labelMovement(k){const labels={service_receipt:['وارد خدمة','Service Receipt'],service_payment:['صادر خدمة','Service Payment'],customer_advance:['مقدم عميل','Customer Advance'],advance_allocation:['تخصيص مقدم','Advance Allocation'],advance_refund:['رد مقدم','Advance Refund'],office_expense:['مصروف مكتب','Office Expense'],debt_receipt:['تحصيل دين','Debt Collection'],debt_payment:['سداد دين','Debt Payment'],custody_in:['استلام أمانة','Custody Received'],custody_out:['رد أمانة','Custody Returned'],transfer_in:['تحويل وارد','Incoming Transfer'],transfer_out:['تحويل صادر','Outgoing Transfer']};return(labels[k]||[k,k])[lang==='ar'?0:1]}function ledger(rows){return '<div class="scroll"><table><tr><th>'+tr('التاريخ','Date')+'</th><th>'+tr('النوع','Type')+'</th><th>'+tr('العميل','Customer')+'</th><th>'+tr('المبلغ','Amount')+'</th><th>'+tr('الإيصال','Receipt')+'</th><th class="noprint">'+tr('الإجراء','Action')+'</th></tr>'+rows.map(m=>'<tr><td>'+esc(m.business_date)+'</td><td>'+esc(labelMovement(m.kind))+'</td><td>'+esc(parties.find(p=>p.id===m.party_id)?.name||'—')+'</td><td>'+sar(m.amount)+'</td><td>'+esc(m.receipt_number||'—')+'</td><td class="actions noprint">'+(['admin','manager'].includes(role)?'<button class="danger" data-void="'+m.id+'">'+tr('إلغاء الحركة','Void')+'</button>':'—')+'</td></tr>').join('')+'</table></div>'}
function historyHtml(){return '<div class="space"><h2>'+tr('سجل الحركات','Movement Ledger')+'</h2><button class="secondary noprint" onclick="window.print()">'+tr('طباعة / PDF','Print / PDF')+'</button></div><div class="card">'+ledger([...moves].reverse())+'</div>'}
async function voidMove(id){if(!confirm(tr('إلغاء هذه الحركة مع حفظها في السجل؟','Void this movement while keeping its record?')))return;try{const r=await db.from('open_finance_movements').update({voided_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error;toast(tr('أُلغيت الحركة','Movement voided'));await load()}catch(e){err(e)}}
function reportsHtml(){const date=dt(),month=date.slice(0,7);const current=moves.filter(m=>m.business_date?.startsWith(month));const kinds=['service_receipt','service_payment','customer_advance','office_expense'];const sums=Object.fromEntries(kinds.map(k=>[k,current.filter(m=>m.kind===k).reduce((a,m)=>a+ +m.amount,0)]));return '<div class="space"><h2>'+tr('موجز التقارير الشهرية','Monthly Summary')+'</h2><div class="actions noprint"><button class="secondary" onclick="window.print()">PDF</button><button class="secondary" onclick="downloadReport()">TXT</button></div></div><div class="cards">'+[[tr('وارد الخدمات','Service Receipts'),sums.service_receipt],[tr('تكاليف الخدمات المدفوعة','Service Payments'),sums.service_payment],[tr('مقدمات العملاء (ليست إيرادًا)','Customer Advances (Liability)'),sums.customer_advance],[tr('مصاريف المكتب','Office Expenses'),sums.office_expense]].map(x=>'<div class="metric"><span>'+x[0]+'</span><b>'+sar(x[1])+'</b></div>').join('')+'</div>'}
window.downloadReport=()=>{const text=$('#screen').innerText;const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shomoul-'+dt()+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
function attach(){if(tab==='new'){lineRows=[];$('#addIn').onclick=()=>addLine('in');$('#addOut').onclick=()=>addLine('out');$('#servicevalue').oninput=preview;$('#saveOrder').onclick=saveOrder;addLine('in');addLine('out')}if(tab==='movement')$('#saveMovement').onclick=saveMovement;if(tab==='debts')$('#saveDebt').onclick=saveDebt;document.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>voidMove(b.dataset.void))}

window.addEventListener('error',e=>{console.error(e.error);$('#app').innerHTML='<div class="card"><h2>'+tr('تعذر تشغيل الواجهة','Application Error')+'</h2><p>'+esc(e.message)+'</p></div>'});
init();
</script></body></html>
