<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شمول المالي</title><style>:root{font-family:Tahoma,Arial,sans-serif;color:#142d53;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#142d53;color:white;padding:18px 4%;display:flex;justify-content:space-between;align-items:center}header strong{font-size:22px}main{max-width:1200px;margin:auto;padding:22px 14px}nav{display:flex;gap:8px;overflow:auto;margin-bottom:22px}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font-weight:700}nav button{background:white;color:#142d53;white-space:nowrap}nav button.active,.primary{background:#2563b4!important;color:#fff!important}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin-bottom:15px;box-shadow:0 3px 15px #142d530b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{background:#f4f7fc;border-radius:12px;padding:16px}.stat small{color:#62748c}.stat b{font-size:23px;display:block;margin-top:7px}.row{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:145px}label{display:block;font-size:13px;color:#566780;margin-bottom:5px}input,select{width:100%;border:1px solid #cfdae7;border-radius:9px;padding:11px;background:#fff;font-size:15px}h2{font-size:20px;margin:0 0 16px}h3{font-size:16px}table{border-collapse:collapse;width:100%;min-width:540px}td,th{border-bottom:1px solid #e6edf5;padding:11px;text-align:right;font-size:13px}th{background:#f5f7fa}.scroll{overflow:auto}.muted{color:#64748b;font-size:13px}.danger{color:#b91c1c}.good{color:#15803d}.secondary{background:#e9f0fb;color:#142d53}.hidden{display:none}.line{background:#f6f8fc;border-radius:10px;padding:10px;margin:7px 0}.notice{background:#fff4df;border:1px solid #f3cb80;border-radius:10px;padding:12px;font-size:13px;margin:15px 0}@media print{header,nav,.noprint{display:none!important}.card{break-inside:avoid;box-shadow:none}main{max-width:none}}@media(max-width:480px){.card{padding:13px}header strong{font-size:18px}}</style><style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap');
:root{font-family:'Tajawal',Tahoma,sans-serif;color:#142d53;background:#f6f8fc}body{font-family:'Tajawal',Tahoma,sans-serif;background:radial-gradient(ellipse at 92% 0%,#e8effb 0,transparent 43%),#f6f8fc;color:#172e50}header{background:linear-gradient(115deg,#101f3c,#173967 65%,#2563b4);padding:22px clamp(16px,4vw,60px);box-shadow:0 8px 30px #102c5324;min-height:86px}header strong{font-size:25px;letter-spacing:-.6px}header small{border:1px solid #ffffff50;background:#ffffff13;border-radius:50px;padding:8px 15px}main{max-width:1360px;padding:30px 20px}nav{gap:9px;padding:6px 0 14px;position:sticky;top:0;background:#f6f8fcee;backdrop-filter:blur(15px);z-index:10}nav button{font-family:inherit;border:1px solid #e4eaf4;background:#fff;border-radius:13px;padding:13px 18px;box-shadow:0 2px 8px #10294909}nav button.active{background:#142d53!important;box-shadow:0 7px 18px #14385a30}.card{border:1px solid #e7ecf5;border-radius:22px;padding:26px;margin-bottom:20px;box-shadow:0 9px 30px #122e5010}h2{font-weight:800;font-size:22px}h3{font-weight:800;color:#18345b;padding-top:12px}.grid{gap:15px}.stat{background:linear-gradient(150deg,#f7faff,#edf3ff);border:1px solid #e8eef7;border-radius:18px;padding:22px;min-height:105px}.stat b{font-size:25px;letter-spacing:-.5px}.stat small{font-size:13px;font-weight:700}.primary{background:linear-gradient(115deg,#142d53,#2563b4)!important;box-shadow:0 6px 16px #193c6e2a}.secondary{background:#edf3fd;border:1px solid #dae5f4;color:#193961}button{font-family:inherit;font-size:14px;border-radius:12px;transition:transform .15s,box-shadow .15s}button:active{transform:scale(.98)}input,select{font-family:inherit;min-height:46px;border:1px solid #dbe3ef;border-radius:12px;outline:none;transition:border .15s,box-shadow .15s}input:focus,select:focus{border-color:#4383d5;box-shadow:0 0 0 3px #2563b41c}label{font-weight:700;color:#455c7b;font-size:13px}th{background:#f0f5fd;color:#2a4a73}td,th{padding:15px}.line{background:#f7faff;border:1px solid #eaf0f7;border-radius:15px;padding:14px}.notice{background:#fffaec;border-color:#efdfb1;color:#755a26;border-radius:15px}.row{gap:13px} .good{color:#16804f}.danger{color:#c43c48}@media(max-width:600px){main{padding:14px 10px}.card{padding:16px;border-radius:17px}header{padding:18px 14px;min-height:72px}header strong{font-size:19px}header small{font-size:10px}nav button{padding:11px 13px}.stat{padding:14px;min-height:90px}.stat b{font-size:19px}}@media print{header,nav{display:none!important}}
</style></head><body><header><strong>شمول المالي <span style="font-size:12px;font-weight:normal">| الإدارة المالية</span></strong><small>إدارة أعمالك بثقة ✦</small></header><main><div class="notice">هذه نسخة تشغيل محلية على هذا المتصفح، وليست جاهزة للاستخدام المالي الجماعي أو بيانات العملاء الحقيقية؛ لا تحتوي على تسجيل دخول أو خادم آمن أو مزامنة بين الموظفين.</div><nav id="nav"></nav><div id="app"></div></main><script>
const $=s=>document.querySelector(s), fmt=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}), money=n=>fmt(n)+' ر.س', today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()), rid=()=>crypto.randomUUID();
let data;try{data=JSON.parse(localStorage.getItem('shomoul-finance-v1'))}catch{}data||={accounts:[{id:'cash',name:'كاش',opening:0},{id:'ahli',name:'الأهلي',opening:0},{id:'rajhi',name:'الراجحي',opening:0}],services:[{id:'s1',name:'تجديد إقامة'},{id:'s2',name:'نقل خدمات'},{id:'s3',name:'إصدار سجل تجاري'}],parties:[],orders:[],moves:[]};const save=()=>localStorage.setItem('shomoul-finance-v1',JSON.stringify(data));let view='الرئيسية';const screens=['الرئيسية','عملية جديدة','حركة مالية','السجل اليومي','العملاء','التقارير','الإعدادات'];function go(v){view=v;draw()};function account(id){return data.accounts.find(a=>a.id===id)?.name||'—'}function balance(a){return (+a.opening||0)+data.moves.filter(m=>m.status==='paid').reduce((s,m)=>s+((m.to===a.id?m.amount:0)-(m.from===a.id?m.amount:0)),0)}function selectAccounts(selected='',empty=false){return (empty?'<option value="">غير محدد</option>':'')+data.accounts.map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.name)}</option>`).join('')}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function totals(){return data.moves.filter(m=>m.status==='paid'&&m.date===today()).reduce((o,m)=>{if(m.kind==='in')o.inc+=m.amount;if(m.kind==='out')o.out+=m.amount;return o},{inc:0,out:0})}
function draw(){ $('#nav').innerHTML=screens.map(s=>`<button class="${s===view?'active':''}" onclick="go('${s}')">${s}</button>`).join('');$('#app').innerHTML=({ 'الرئيسية':dashboard,'عملية جديدة':orderScreen,'حركة مالية':transferScreen,'السجل اليومي':history,'العملاء':customers,'التقارير':reports,'الإعدادات':settings})[view]();if(view==='عملية جديدة')templateUpdate(false)}function dashboard(){const t=totals(),balances=data.accounts.map(a=>({name:a.name,b:balance(a)})),due=data.orders.reduce((s,o)=>s+Math.max(0,o.price-o.income),0);const custody=data.moves.filter(m=>m.status==='paid'&&['entrust_in','entrust_out'].includes(m.kind)).reduce((s,m)=>s+(m.kind==='entrust_in'?m.amount:-m.amount),0);return `<div class="card"><h2>المركز المالي</h2><div class="grid">${balances.map(a=>`<div class="stat"><small>${esc(a.name)}</small><b>${money(a.b)}</b></div>`).join('')}<div class="stat"><small>وارد اليوم</small><b class="good">${money(t.inc)}</b></div><div class="stat"><small>صادر اليوم</small><b class="danger">${money(t.out)}</b></div><div class="stat"><small>مستحقات لنا من الخدمات</small><b>${money(due)}</b></div><div class="stat"><small>أمانات العملاء</small><b>${money(custody)}</b></div><div class="stat"><small>عجز تغطية الأمانات (مؤشر إجمالي)</small><b class="danger">${money(Math.max(0,custody-balances.reduce((s,a)=>s+a.b,0)))}</b></div></div></div><div class="card"><h2>العمليات الأخيرة</h2>${movesTable(data.moves.slice(-12).reverse())}</div>`}
function orderScreen(){return `<div class="card"><h2>تسجيل خدمة جديدة</h2><div class="row"><div class="field"><label>اسم العميل</label><input id="customer" placeholder="عميل نقدي / اسم العميل" list="partylist"><datalist id="partylist">${data.parties.map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div><div class="field"><label>اسم الخدمة (اختر أو اكتب)</label><input id="service" list="servicelist" placeholder="اكتب اسم الخدمة بحرية" oninput="templateUpdate(true)"><datalist id="servicelist">${data.services.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist></div><div class="field"><label>سعر العملية (يدوي لكل عميل)</label><input id="price" type="number" min="0" step=".01"></div><div class="field"><label>التكلفة المقدرة (اختياري)</label><input id="expected" type="number" min="0" step=".01"></div></div><h3>الوارد (يمكن إضافة أكثر من بند)</h3><div id="inlines"></div><button class="secondary" onclick="addLine('in')">+ إضافة وارد</button><h3>الصادر (يمكن إضافة أكثر من بند)</h3><div id="outlines"></div><button class="secondary" onclick="addLine('out')">+ إضافة صادر</button><div class="row" style="margin-top:17px"><div class="field"><label>حالة الخدمة</label><select id="orderstatus"><option value="open">قيد التنفيذ</option><option value="completed">مكتملة</option></select></div><div class="field"><label>اسم الموظف المنفذ</label><input id="staff" placeholder="اسم الموظف"></div></div><p class="muted">المبالغ المؤجلة لا تؤثر على الكاش أو البنك قبل إثبات الدفع. المبالغ الفعلية قد تكون من عدة حسابات.</p><button class="primary" onclick="saveOrder()">حفظ العملية</button></div>`}
function templateUpdate(reset){if(!$('#price'))return;if(reset){$('#price').value='';$('#expected').value='';$('#inlines').innerHTML='';$('#outlines').innerHTML='';addLine('in');addLine('out')}else if(!$('#inlines').children.length){addLine('in');addLine('out')}}function addLine(type,amount=''){const id=rid(),target=type==='in'?'inlines':'outlines';$('#'+target).insertAdjacentHTML('beforeend',`<div class="row line" id="l${id}" data-type="${type}"><div class="field"><label>المبلغ</label><input class="amount" type="number" min="0" step=".01" value="${amount}"></div><div class="field"><label>${type==='in'?'دخل إلى':'خرج من'}</label><select class="account">${selectAccounts(type==='in'?'cash':'ahli')}</select></div><div class="field"><label>الحالة</label><select class="status"><option value="paid">تم فعلاً</option><option value="pending">مؤجل</option></select></div>${type==='out'?'<div class="field"><label>سبب الصرف</label><input class="reason" placeholder="رسوم حكومية / معقب"></div>':''}<button class="secondary" onclick="$('#l${id}').remove()">حذف</button></div>`)}function getLines(type){return [...document.querySelectorAll('#'+(type==='in'?'inlines':'outlines')+' .line')].map(el=>({amount:Number(el.querySelector('.amount').value),account:el.querySelector('.account').value,status:el.querySelector('.status').value,reason:el.querySelector('.reason')?.value||''})).filter(x=>x.amount>0)}function saveOrder(){const name=$('#customer').value.trim()||'عميل نقدي',price=Number($('#price').value),expected=Number($('#expected').value),staff=$('#staff').value.trim(),ins=getLines('in'),outs=getLines('out');if(!Number.isFinite(price)||price<0||!Number.isFinite(expected)||expected<0)return alert('تحقق من الأرقام');if(ins.reduce((s,x)=>s+x.amount,0)>price+.001)return alert('إجمالي الوارد يتجاوز قيمة الخدمة، سجّل الزيادة كأمانة أو مقدم منفصل');if(!$('#service').value.trim())return alert('اكتب اسم الخدمة');if(!ins.length&&!outs.length)return alert('أضف واردًا أو صادرًا');const id=rid(),date=today(),order={id,name,service:$('#service').value.trim()||'خدمة أخرى',price,expected,staff,status:$('#orderstatus').value,date,income:ins.reduce((s,x)=>s+(x.status==='paid'?x.amount:0),0),cost:outs.reduce((s,x)=>s+x.amount,0)};data.orders.push(order);if(!data.parties.includes(name))data.parties.push(name);[...ins.map(x=>({...x,kind:'in'})),...outs.map(x=>({...x,kind:'out'}))].forEach(x=>data.moves.push({id:rid(),orderId:id,party:name,kind:x.kind,amount:x.amount,status:x.status,from:x.kind==='out'?x.account:null,to:x.kind==='in'?x.account:null,date,reason:x.reason||order.service,staff}));save();alert('تم حفظ العملية');go('السجل اليومي')}
function transferScreen(){return `<div class="card"><h2>تسجيل حركة مالية مستقلة</h2><div class="row"><div class="field"><label>نوع الحركة</label><select id="kind"><option value="transfer">تحويل بين الحسابات</option><option value="expense">مصروف للمكتب</option><option value="collection">تحصيل مستحق سابق</option><option value="entrust_in">استلام أمانة عميل</option><option value="entrust_out">رد أمانة عميل</option></select></div><div class="field"><label>المبلغ</label><input id="amount" type="number" step=".01" min="0"></div><div class="field"><label>من حساب</label><select id="from">${selectAccounts('cash',true)}</select></div><div class="field"><label>إلى حساب</label><select id="to">${selectAccounts('ahli',true)}</select></div></div><div class="row"><div class="field"><label>العميل أو الطرف</label><input id="party" placeholder="الاسم"></div><div class="field"><label>البيان</label><input id="reason" placeholder="سبب الحركة"></div></div><p class="muted">للصرف اختر «من حساب» فقط، وللتحصيل اختر «إلى حساب» فقط، وللتحويل اختر الاثنين. استخدام الأمانات دون إذن أو تتبع منفصل غير مدعوم هنا.</p><button class="primary" onclick="saveMove()">حفظ الحركة</button></div>`}function saveMove(){const kind=$('#kind').value,amount=Number($('#amount').value),from=$('#from').value,to=$('#to').value,party=$('#party').value.trim(),reason=$('#reason').value.trim();if(!(amount>0))return alert('أدخل مبلغًا صحيحًا');const needsFrom=['transfer','expense','entrust_out'].includes(kind),needsTo=['transfer','collection','entrust_in'].includes(kind);if((needsFrom&&!from)||(needsTo&&!to))return alert('حدد الحساب المطلوب');if(kind==='transfer'&&from===to)return alert('الحسابان يجب أن يختلفا');if(['entrust_in','entrust_out'].includes(kind)&&!party)return alert('سجّل اسم صاحب الأمانة');data.moves.push({id:rid(),orderId:null,kind,amount,status:'paid',from:needsFrom?from:null,to:needsTo?to:null,party,date:today(),reason});if(party&&!data.parties.includes(party))data.parties.push(party);save();alert('تم حفظ الحركة');go('السجل اليومي')}
function movesTable(arr){return `<div class="scroll"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>الطرف</th><th>الحساب</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>${arr.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(({in:'وارد خدمة',out:'صادر خدمة',transfer:'تحويل',expense:'مصروف',collection:'تحصيل',entrust_in:'استلام أمانة',entrust_out:'رد أمانة'})[m.kind])}</td><td>${esc(m.party)}</td><td>${esc(m.from?account(m.from):'')} ${m.from&&m.to?'←':''} ${esc(m.to?account(m.to):'')}</td><td>${money(m.amount)}</td><td>${m.status==='paid'?'تم':'مؤجل'}</td></tr>`).join('')||'<tr><td colspan="6">لا توجد عمليات</td></tr>'}</tbody></table></div>`}function history(){return `<div class="card"><div class="row noprint"><div class="field"><label>تاريخ العمليات</label><input id="histdate" type="date" value="${today()}" onchange="filterHistory()"></div><button onclick="window.print()" class="secondary">طباعة اليوم</button><button onclick="exportCsv()" class="secondary">تصدير CSV</button></div><h2>سجل العمليات</h2><div id="historytable"></div></div>`}function filterHistory(){$('#historytable').innerHTML=movesTable(data.moves.filter(m=>m.date===$('#histdate').value))}function exportCsv(){const day=$('#histdate').value,rows=data.moves.filter(x=>x.date===day),csv='\ufeff'+'التاريخ,النوع,الطرف,المبلغ,الحالة\n'+rows.map(m=>[m.date,m.kind,m.party,m.amount,m.status].map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='shomoul-'+day+'.csv';a.click();URL.revokeObjectURL(a.href)}function customers(){return `<div class="card"><h2>حسابات العملاء</h2><div class="scroll"><table><tr><th>العميل</th><th>عدد الخدمات</th><th>المستحق للمكتب</th></tr>${data.parties.map(p=>{const ord=data.orders.filter(o=>o.name===p);return `<tr><td>${esc(p)}</td><td>${ord.length}</td><td>${money(ord.reduce((s,o)=>s+o.price-o.income,0))}</td></tr>`}).join('')}</table></div><p class="muted">حسابات العملاء حاليًا للعرض. توزيع سداد دفعة مجمعة يدويًا لم يُنفذ بعد.</p></div>`}function reports(){const map={};data.moves.forEach(m=>{const key=m.date.slice(0,7);(map[key]??={in:0,out:0,operations:0});map[key].operations++;if(m.status==='paid'&&m.kind==='in')map[key].in+=m.amount;if(m.status==='paid'&&m.kind==='out')map[key].out+=m.amount});return `<div class="card"><h2>التقرير الشهري</h2><div class="scroll"><table><tr><th>الشهر</th><th>عدد الحركات</th><th>وارد الخدمات المحصّل</th><th>صادر الخدمات المدفوع</th><th>صافي حركة الخدمات النقدية</th></tr>${Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>`<tr><td>${k}</td><td>${v.operations}</td><td>${money(v.in)}</td><td>${money(v.out)}</td><td>${money(v.in-v.out)}</td></tr>`).join('')}</table></div><button class="secondary noprint" onclick="window.print()">طباعة التقرير</button><p class="muted">صافي الحركة النقدية ليس صافي الربح المحاسبي. التقارير الأسبوعية والتارقت لم تُنفذ بعد.</p></div>`}function settings(){return `<div class="card"><h2>دليل أسماء الخدمات</h2><p class="muted">الخدمات مجرد اقتراحات، والسعر يدوي بالكامل لكل عميل.</p><div class="scroll"><table><tr><th>اسم الخدمة</th></tr>${data.services.map(s=>`<tr><td>${esc(s.name)}</td></tr>`).join('')}</table></div><div class="row"><div class="field"><label>إضافة اسم خدمة</label><input id="newserv" placeholder="اسم الخدمة فقط"></div><button class="primary" onclick="addService()">إضافة</button></div></div><div class="card"><h2>الأرصدة الافتتاحية</h2>${data.accounts.map(a=>`<div class="row line"><div class="field"><label>${esc(a.name)}</label><input id="open${a.id}" type="number" step=".01" value="${a.opening}"></div></div>`).join('')}<button class="primary" onclick="saveOpening()">حفظ الأرصدة</button><p class="danger muted">لا تغيّر الأرصدة الافتتاحية بعد بدء العمليات الفعلية.</p></div><div class="card"><h2>نسخة احتياطية</h2><button class="secondary" onclick="backup()">تنزيل البيانات JSON</button></div>`}function addService(){const name=$('#newserv').value.trim();if(!name)return alert('اكتب اسم الخدمة');if(!data.services.some(s=>s.name===name))data.services.push({id:rid(),name});save();draw()}function saveOpening(){data.accounts.forEach(a=>a.opening=Number($('#open'+a.id).value)||0);save();alert('تم الحفظ')}function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='shomoul-finance-backup.json';a.click()}draw();if(view==='السجل اليومي')filterHistory();const oldGo=go;go=function(v){oldGo(v);if(v==='السجل اليومي')filterHistory()};</script></body></html>
