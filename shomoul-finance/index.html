let data;try{data=JSON.parse(localStorage.getItem('shomoul-finance-v1'))}catch{}data||={accounts:[{id:'cash',name:'كاش',opening:0},{id:'ahli',name:'الأهلي',opening:0},{id:'rajhi',name:'الراجحي',opening:0}],services:[{id:'s1',name:'تجديد إقامة'},{id:'s2',name:'نقل خدمات'},{id:'s3',name:'إصدار سجل تجاري'}],parties:[],orders:[],moves:[]};data.debts??=[];const save=()=>localStorage.setItem('shomoul-finance-v1',JSON.stringify(data));let view='الرئيسية';const screens=['الرئيسية','عملية جديدة','حركة مالية','الديون','السجل اليومي','العملاء','التقارير','الإعدادات'];function go(v){view=v;draw()};function account(id){return data.accounts.find(a=>a.id===id)?.name||'—'}function balance(a){return (+a.opening||0)+data.moves.filter(m=>m.status==='paid').reduce((s,m)=>s+((m.to===a.id?m.amount:0)-(m.from===a.id?m.amount:0)),0)}function selectAccounts(selected='',empty=false){return (empty?'<option value="">غير محدد</option>':'')+data.accounts.map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.name)}</option>`).join('')}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function totals(){return data.moves.filter(m=>m.status==='paid'&&m.date===today()).reduce((o,m)=>{if(m.kind==='in')o.inc+=m.amount;if(m.kind==='out')o.out+=m.amount;return o},{inc:0,out:0})}

function addDebt(){const party=$('#dp').value.trim(),amount=Number($('#da').value);if(!party||!Number.isFinite(amount)||amount<=0)return alert('أدخل الاسم والمبلغ');data.debts.push({party,type:$('#dt').value,amount,balance:amount,due:$('#dd').value,date:today()});save();draw();}
function payDebt(i){const d=data.debts[i],v=Number(prompt('المبلغ المسدد')),a=prompt('الحساب cash / ahli / rajhi','cash');if(!Number.isFinite(v)||v<=0||v>d.balance||!data.accounts.some(x=>x.id===a))return alert('تحقق من المبلغ والحساب');d.balance=+(d.balance-v).toFixed(2);data.moves.push({id:rid(),kind:d.type==='us'?'collection':'debt_payment',amount:v,status:'paid',from:d.type==='them'?a:null,to:d.type==='us'?a:null,party:d.party,date:today(),reason:'سداد مديونية'});save();draw();}
function orderScreen(){return `<div class="register-head"><div><span class="eyebrow">✦ تسجيل مالي سلس / شمول الأنظمة</span><h2>عملية جديدة</h2><p class="muted">دقيقة واحدة تكفي: العميل، اسم الخدمة بحرية، الوارد والصادر ثم الحفظ.</p></div><span class="step-pill">● عملية جديدة</span></div><div class="card register-card"><div class="section-title"><span class="section-symbol">01</span><div><h3>بيانات العملية</h3><small>البيانات الأساسية فقط</small></div></div><div class="row"><div class="field"><label>اسم العميل</label><input id="customer" placeholder="اسم العميل أو عميل نقدي" list="partylist"><datalist id="partylist">${data.parties.map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div><div class="field"><label>اسم الخدمة <span class="required">*</span></label><input id="service" type="text" placeholder="مثال: طباعة برنت، خدمة جديدة، أي وصف تختاره" autocomplete="off" aria-describedby="service-help"><small id="service-help" class="help-open">✦ اكتب أي خدمة مباشرة، حتى لو لم تُضف من قبل. لا توجد قائمة إجبارية أو سعر ثابت.</small></div></div><div class="row subdued-row"><div class="field"><label>المبلغ المخصص لهذه الخدمة من الوارد (اختياري، والباقي رصيد للعميل)</label><input id="allocated" type="number" min="0" step=".01" placeholder="فارغ = كامل الوارد" oninput="updateSummary()"></div><div class="field"><label>التكلفة المتوقعة (اختياري)</label><input id="expected" type="number" min="0" step=".01" placeholder="0.00" oninput="updateSummary()"></div><div class="field"><label>الموظف المنفذ</label><input id="staff" placeholder="اسم الموظف"></div></div></div><div class="entry-section income-panel"><div class="entry-top"><div><span class="entry-icon">↙</span><h3>الوارد <small>المبالغ المستلمة من العميل</small></h3></div><strong id="inTotal">0.00 ر.س</strong></div><div id="inlines"></div><button class="add-entry green-btn" onclick="addLine('in')">＋ إضافة وارد آخر</button></div><div class="entry-section outcome-panel"><div class="entry-top"><div><span class="entry-icon">↗</span><h3>الصادر <small>المبالغ المدفوعة لإنجاز الخدمة</small></h3></div><strong id="outTotal">0.00 ر.س</strong></div><div id="outlines"></div><button class="add-entry red-btn" onclick="addLine('out')">＋ إضافة صادر آخر</button></div><div class="summary-panel"><div class="summary-title"><span>◈</span><div><h3>ملخص العملية</h3><small>يُحسب تلقائيًا عند إدخال المبالغ</small></div></div><div class="summary-grid"><div><small>إجمالي الوارد</small><strong id="sumIn">0.00</strong></div><div><small>إجمالي الصادر</small><strong id="sumOut">0.00</strong></div><div><small>المتبقي على العميل</small><strong id="sumDue">0.00</strong></div><div class="net-profit"><small>صافي العملية المبدئي</small><strong id="sumNet">0.00 ر.س</strong></div></div><p class="muted">صافي العملية هنا هو الوارد ناقص الصادر، وليس الربح المحاسبي النهائي. البنود المؤجلة لا تغيّر أرصدة البنوك حتى تُدفع.</p></div><div class="save-bar"><button class="primary save-main" onclick="saveOrder()">✓ حفظ العملية</button><span class="muted">يمكنك تغيير اسم الخدمة والسعر لكل عميل دون أي قيود.</span></div>`}
function templateUpdate(reset){if(!$('#price'))return;if(reset){$('#price').value='';$('#expected').value='';$('#inlines').innerHTML='';$('#outlines').innerHTML=''}if(!$('#inlines').children.length)addLine('in');if(!$('#outlines').children.length)addLine('out');updateSummary()}
function addLine(type,amount=''){const id=rid(),target=type==='in'?'inlines':'outlines';$('#'+target).insertAdjacentHTML('beforeend',`<div class="row line" id="l${id}" data-type="${type}"><div class="field"><label>المبلغ (ر.س)</label><input class="amount" type="number" min="0" step=".01" placeholder="0.00" value="${amount}" oninput="updateSummary()"></div><div class="field"><label>${type==='in'?'تم الاستلام في':'تم الدفع من'}</label><select class="account">${selectAccounts(type==='in'?'cash':'ahli')}</select></div><div class="field"><label>الحالة</label><select class="status" onchange="updateSummary()"><option value="paid">تم فعلاً</option><option value="pending">مؤجل</option></select></div>${type==='out'?'<div class="field"><label>سبب الصرف</label><input class="reason" placeholder="رسوم / معقب / أخرى"></div>':''}<button class="remove-entry" title="حذف البند" onclick="$('#l${id}').remove();updateSummary()">✕</button></div>`);updateSummary()}
function updateSummary(){if(!$('#sumNet'))return;const ins=getLines('in'),outs=getLines('out'),income=ins.reduce((a,x)=>a+x.amount,0),cost=outs.reduce((a,x)=>a+x.amount,0),received=ins.filter(x=>x.status==='paid').reduce((a,x)=>a+x.amount,0),paid=outs.filter(x=>x.status==='paid').reduce((a,x)=>a+x.amount,0),price=($('#allocated')?.value.trim()?Number($('#allocated').value):income);$('#inTotal').textContent=money(income)+' ر.س';$('#outTotal').textContent=money(cost)+' ر.س';$('#sumIn').textContent=money(income);$('#sumOut').textContent=money(cost);$('#sumDue').textContent=money(ins.filter(x=>x.status==='pending').reduce((a,x)=>a+x.amount,0));$('#sumNet').textContent=money(received-paid)+' ر.س';$('#sumNet').style.color=received-paid<0?'#ef7676':'#86efac'}
function getLines(type){return [...document.querySelectorAll('#'+(type==='in'?'inlines':'outlines')+' .line')].map(el=>({amount:Number(el.querySelector('.amount').value),account:el.querySelector('.account').value,status:el.querySelector('.status').value,reason:el.querySelector('.reason')?.value||''})).filter(x=>x.amount>0)}function saveOrder(){const name=$('#customer').value.trim()||'عميل نقدي',price=getLines('in').reduce((a,x)=>a+x.amount,0),expected=Number($('#expected').value),staff=$('#staff').value.trim(),ins=getLines('in'),outs=getLines('out');if(!Number.isFinite(price)||price<0||!Number.isFinite(expected)||expected<0)return alert('تحقق من الأرقام');if(!$('#service').value.trim())return alert('اكتب اسم الخدمة');if(!ins.length&&!outs.length)return alert('أضف واردًا أو صادرًا');const allocated=$('#allocated').value.trim()===''?price:Number($('#allocated').value);if(!Number.isFinite(allocated)||allocated<0||allocated>price)return alert('تحقق من المبلغ المخصص للخدمة');const id=rid(),date=today(),order={id,name,service:$('#service').value.trim()||'خدمة أخرى',price:allocated,credit:Math.max(0,ins.filter(x=>x.status==='paid').reduce((a,x)=>a+x.amount,0)-allocated),expected,staff,status:'completed',date,income:ins.reduce((s,x)=>s+(x.status==='paid'?x.amount:0),0),cost:outs.reduce((s,x)=>s+x.amount,0)};data.orders.push(order);if(!data.parties.includes(name))data.parties.push(name);[...ins.map(x=>({...x,kind:'in'})),...outs.map(x=>({...x,kind:'out'}))].forEach(x=>data.moves.push({id:rid(),orderId:id,party:name,kind:x.kind,amount:x.amount,status:x.status,from:x.kind==='out'?x.account:null,to:x.kind==='in'?x.account:null,date,reason:x.reason||order.service,staff}));save();alert('تم حفظ العملية');go('السجل اليومي')}
function transferScreen(){return `<div class="card"><h2>تسجيل حركة مالية مستقلة</h2><div class="row"><div class="field"><label>نوع الحركة</label><select id="kind"><option value="transfer">تحويل بين الحسابات</option><option value="expense">مصروف للمكتب</option><option value="collection">تحصيل مستحق سابق</option><option value="entrust_in">استلام أمانة عميل</option><option value="entrust_out">رد أمانة عميل</option></select></div><div class="field"><label>المبلغ</label><input id="amount" type="number" step=".01" min="0"></div><div class="field"><label>من حساب</label><select id="from">${selectAccounts('cash',true)}</select></div><div class="field"><label>إلى حساب</label><select id="to">${selectAccounts('ahli',true)}</select></div></div><div class="row"><div class="field"><label>العميل أو الطرف</label><input id="party" placeholder="الاسم"></div><div class="field"><label>البيان</label><input id="reason" placeholder="سبب الحركة"></div></div><p class="muted">للصرف اختر «من حساب» فقط، وللتحصيل اختر «إلى حساب» فقط، وللتحويل اختر الاثنين. استخدام الأمانات دون إذن أو تتبع منفصل غير مدعوم هنا.</p><button class="primary" onclick="saveMove()">حفظ الحركة</button></div>`}function saveMove(){const kind=$('#kind').value,amount=Number($('#amount').value),from=$('#from').value,to=$('#to').value,party=$('#party').value.trim(),reason=$('#reason').value.trim();if(!(amount>0))return alert('أدخل مبلغًا صحيحًا');const needsFrom=['transfer','expense','entrust_out'].includes(kind),needsTo=['transfer','collection','entrust_in'].includes(kind);if((needsFrom&&!from)||(needsTo&&!to))return alert('حدد الحساب المطلوب');if(kind==='transfer'&&from===to)return alert('الحسابان يجب أن يختلفا');if(['entrust_in','entrust_out'].includes(kind)&&!party)return alert('سجّل اسم صاحب الأمانة');data.moves.push({id:rid(),orderId:null,kind,amount,status:'paid',from:needsFrom?from:null,to:needsTo?to:null,party,date:today(),reason});if(party&&!data.parties.includes(party))data.parties.push(party);save();alert('تم حفظ الحركة');go('السجل اليومي')}
function movesTable(arr){return `<div class="scroll"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>الطرف</th><th>الحساب</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody>${arr.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(({in:'وارد خدمة',out:'صادر خدمة',transfer:'تحويل',expense:'مصروف',collection:'تحصيل',entrust_in:'استلام أمانة',entrust_out:'رد أمانة'})[m.kind])}</td><td>${esc(m.party)}</td><td>${esc(m.from?account(m.from):'')} ${m.from&&m.to?'←':''} ${esc(m.to?account(m.to):'')}</td><td>${money(m.amount)}</td><td>${m.status==='paid'?'تم':'مؤجل'}</td></tr>`).join('')||'<tr><td colspan="6">لا توجد عمليات</td></tr>'}</tbody></table></div>`}function history(){return `<div class="card"><div class="row noprint"><div class="field"><label>تاريخ العمليات</label><input id="histdate" type="date" value="${today()}" onchange="filterHistory()"></div><button onclick="window.print()" class="secondary">طباعة اليوم</button><button onclick="exportCsv()" class="secondary">تصدير CSV</button></div><h2>سجل العمليات</h2><div id="historytable"></div></div>`}function filterHistory(){$('#historytable').innerHTML=movesTable(data.moves.filter(m=>m.date===$('#histdate').value))}function exportCsv(){const day=$('#histdate').value,rows=data.moves.filter(x=>x.date===day),csv='\ufeff'+'التاريخ,النوع,الطرف,المبلغ,الحالة\n'+rows.map(m=>[m.date,m.kind,m.party,m.amount,m.status].map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='shomoul-'+day+'.csv';a.click();URL.revokeObjectURL(a.href)}function customers(){return `<div class="card"><h2>حسابات العملاء</h2><div class="scroll"><table><tr><th>العميل</th><th>عدد الخدمات</th><th>المستحق للمكتب</th><th>رصيد مقدم للعميل</th></tr>${data.parties.map(p=>{const ord=data.orders.filter(o=>o.name===p);return `<tr><td>${esc(p)}</td><td>${ord.length}</td><td>${money(Math.max(0,ord.reduce((s,o)=>s+o.price-Math.min(o.price,o.income),0)))}</td><td>${money(ord.reduce((s,o)=>s+(o.credit||0),0))}</td></tr>`}).join('')}</table></div><p class="muted">حسابات العملاء حاليًا للعرض. توزيع سداد دفعة مجمعة يدويًا لم يُنفذ بعد.</p></div>`}function reports(){const paid=data.moves.filter(m=>m.status==='paid');const dateKey=m=>m.date||'';const localDate=today();const periods=[{id:'today',title:'اليوم',match:d=>d===localDate},{id:'week',title:'آخر 7 أيام',match:d=>{const x=new Date(localDate+'T12:00:00'),y=new Date(d+'T12:00:00');return (x-y)>=0&&(x-y)<7*86400000;}},{id:'month',title:'الشهر الحالي',match:d=>d.slice(0,7)===localDate.slice(0,7)},{id:'all',title:'جميع الفترات',match:d=>true}];const chosen=periods.find(p=>p.id===(window.reportPeriod||'today'))||periods[0];const rows=paid.filter(m=>chosen.match(dateKey(m)));const actualIn=rows.filter(m=>m.kind==='in').reduce((a,m)=>a+m.amount,0),actualOut=rows.filter(m=>m.kind==='out').reduce((a,m)=>a+m.amount,0),expenses=rows.filter(m=>m.kind==='expense').reduce((a,m)=>a+m.amount,0),collections=rows.filter(m=>m.kind==='collection').reduce((a,m)=>a+m.amount,0);const currency=x=>money(x)+' ر.س';const pending=data.moves.filter(m=>m.status==='pending'&&chosen.match(dateKey(m)));const grouping={};rows.forEach(m=>{const k=dateKey(m);const item=grouping[k]??={i:0,o:0,e:0,c:0,n:0};item.n++;if(m.kind==='in')item.i+=m.amount;if(m.kind==='out')item.o+=m.amount;if(m.kind==='expense')item.e+=m.amount;if(m.kind==='collection')item.c+=m.amount;});const accounts=data.accounts.map(a=>({name:a.name,balance:balance(a)}));return `<div class="report-header"><div><span class="eyebrow">◈ تقارير شمول المالية</span><h2>التقارير والتحليل</h2><p class="muted">المبالغ المقبوضة والمدفوعة فعليًا فقط، دون احتساب التحويلات كإيراد.</p></div><div class="noprint"><button class="secondary" onclick="window.print()">PDF / طباعة</button><button class="secondary" onclick="exportReportText()">ملخص نصي TXT</button></div></div><div class="period-tabs noprint">${periods.map(p=>`<button class="${chosen.id===p.id?'active':''}" onclick="window.reportPeriod='${p.id}';draw()">${p.title}</button>`).join('')}</div><div class="report-grid"><div class="report-stat green"><span>↙ وارد الخدمات المحصّل</span><strong>${currency(actualIn)}</strong></div><div class="report-stat red"><span>↗ صادر إنجاز الخدمات</span><strong>${currency(actualOut)}</strong></div><div class="report-stat"><span>◈ صافي حركة الخدمات النقدية</span><strong>${currency(actualIn-actualOut)}</strong></div><div class="report-stat"><span>▤ المصاريف العامة</span><strong>${currency(expenses)}</strong></div><div class="report-stat"><span>◉ تحصيل ديون سابقة</span><strong>${currency(collections)}</strong></div><div class="report-stat"><span>◷ حركات مؤجلة</span><strong>${pending.length}</strong></div></div><div class="card report-card"><h3>تفاصيل حركة الفترة</h3><div class="scroll"><table><tr><th>التاريخ</th><th>عدد الحركات</th><th>وارد الخدمات</th><th>صادر الخدمات</th><th>مصاريف عامة</th><th>تحصيل سابق</th><th>صافي حركة الخدمات</th></tr>${Object.entries(grouping).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td class="good">${money(v.i)}</td><td class="danger">${money(v.o)}</td><td>${money(v.e)}</td><td>${money(v.c)}</td><td><b>${money(v.i-v.o)}</b></td></tr>`).join('')||'<tr><td colspan="7">لا توجد حركات مدفوعة في هذه الفترة</td></tr>'}</table></div></div><div class="card report-card"><h3>الأرصدة الحالية للحسابات</h3><div class="report-grid">${accounts.map(a=>`<div class="account-mini"><span>${esc(a.name)}</span><strong>${currency(a.balance)}</strong></div>`).join('')}</div></div><div class="card"><p class="muted">تنبيه محاسبي: صافي حركة الخدمات النقدية ليس صافي الربح النهائي، ولا يتضمن التكاليف غير المدفوعة أو الالتزامات الأخرى. أرقام هذه الصفحة مشتقة من الحركات المحفوظة في هذا المتصفح، وليست تقارير محاسبية مدققة أو مشتركة بين الموظفين.</p></div>`;}
function exportReportText(){const txt='شمول المالي — تقرير '+today()+'\n'+(document.querySelector('#app')?.innerText||'');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download='shomoul-report-'+today()+'.txt';a.click();}function settings(){return `<div class="card"><h2>دليل أسماء الخدمات</h2><p class="muted">الخدمات مجرد اقتراحات، والسعر يدوي بالكامل لكل عميل.</p><div class="scroll"><table><tr><th>اسم الخدمة</th></tr>${data.services.map(s=>`<tr><td>${esc(s.name)}</td></tr>`).join('')}</table></div><div class="row"><div class="field"><label>إضافة اسم خدمة</label><input id="newserv" placeholder="اسم الخدمة فقط"></div><button class="primary" onclick="addService()">إضافة</button></div></div><div class="card"><h2>الأرصدة الافتتاحية</h2>${data.accounts.map(a=>`<div class="row line"><div class="field"><label>${esc(a.name)}</label><input id="open${a.id}" type="number" step=".01" value="${a.opening}"></div></div>`).join('')}<button class="primary" onclick="saveOpening()">حفظ الأرصدة</button><p class="danger muted">لا تغيّر الأرصدة الافتتاحية بعد بدء العمليات الفعلية.</p></div><div class="card"><h2>نسخة احتياطية</h2><button class="secondary" onclick="backup()">تنزيل البيانات JSON</button></div>`}function addService(){const name=$('#newserv').value.trim();if(!name)return alert('اكتب اسم الخدمة');if(!data.services.some(s=>s.name===name))data.services.push({id:rid(),name});save();draw()}function saveOpening(){data.accounts.forEach(a=>a.opening=Number($('#open'+a.id).value)||0);save();alert('تم الحفظ')}function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='shomoul-finance-backup.json';a.click()}draw();if(view==='السجل اليومي')filterHistory();const oldGo=go;go=function(v){oldGo(v);if(v==='السجل اليومي')filterHistory()};</script></body></html>
